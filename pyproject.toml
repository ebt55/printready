[project]
name = "printready"
version = "0.1.0"
description = "Check and fix die-cut sticker artwork against a printer's paraphrased rules, with a planted-defect benchmark."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ebin Babu Thomas" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1",
    "pillow>=11.0",
    "opencv-python-headless>=4.10",
    "scikit-image>=0.24",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "matplotlib>=3.9",
]

[project.scripts]
printready = "printready.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/printready"]

[tool.hatch.build.targets.wheel.force-include]
"profiles" = "printready/profiles"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
